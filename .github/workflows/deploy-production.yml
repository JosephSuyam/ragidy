name: Deploy production

# Promotes the image that staging built and tested for the tagged commit. Never rebuilds.
# Rollback: run this workflow manually with an older tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (e.g. v0.1.0)"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Retag staging images for ${{ env.TAG }}
        run: |
          sha=$(git rev-parse HEAD)
          for app in api web; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$app"
            docker buildx imagetools create -t "$image:$TAG" -t "$image:production" "$image:sha-$sha"
          done
      # shortcut: no hosting target chosen yet; images are promoted but not deployed.
      # Replace with the host's deploy step when one is picked.
      - run: echo "::warning::No production host configured. Images promoted to ${{ env.TAG }} and production."
