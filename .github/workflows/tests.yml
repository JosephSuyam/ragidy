name: Tests

# Full test suite against a real Postgres + pgvector: unit, integration, and root tests/.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ragidy
          POSTGRES_PASSWORD: ragidy
          POSTGRES_DB: ragidy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ragidy"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ragidy:ragidy@localhost:5432/ragidy
    steps:
      - uses: actions/checkout@v4
      - run: psql "postgresql://ragidy:ragidy@localhost:5432/ragidy" -f infrastructure/database/init.sql
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
        working-directory: apps/api
      - run: python infrastructure/scripts/check.py --api

  # e2e: add a Playwright job here when tests/e2e gets its first test.
