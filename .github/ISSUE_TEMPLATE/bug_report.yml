name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact error message or a screenshot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload sample.pdf
        2. Ask "..."
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [upload / ingestion, retrieval / answers, chat UI, api, infrastructure / CI, other]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "commit sha, browser, LLM_PROVIDER / EMBED_PROVIDER"
