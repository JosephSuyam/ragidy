# Web container server block (replaces conf.d/default.conf): serves the SPA and proxies /api/* to the API.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;

    # Resolve api per request through Docker's embedded DNS, so nginx starts without it and follows its restarts.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # Inherited by every proxy_pass below; the API trusts X-Forwarded-For only from TRUSTED_PROXIES.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streamed answers (SSE) must reach the browser as they are produced.
    proxy_buffering off;

    location /api/ {
        # shortcut: rewrite decodes %2F in the path; strip the prefix from $request_uri with a map when a route takes free-form path params.
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
    }

    # File uploads only; every other route keeps the 1m default. 6m must stay above the largest UPLOAD_MAX_MB_* (5) plus 16 KiB of multipart overhead.
    location = /api/documents {
        client_max_body_size 6m;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
    }

    # The callback query holds the OAuth code, which logs must never contain; a prefix (not an exact match) also covers variants like callback/, so /start loses its logs too.
    location /api/auth/oauth/ {
        access_log off;
        # Error lines of every level quote the request line, code included, so drop them here only.
        error_log /dev/null;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $api;
    }

    # Client routes such as /login load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
