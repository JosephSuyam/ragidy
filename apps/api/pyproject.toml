[project]
name = "ragidy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.126",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-ollama>=0.10.0",
    "llama-index-embeddings-openai>=0.7.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-boto3[s3]>=1.43.126",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
# These LlamaIndex integrations ship no py.typed marker; analyze their typed source anyway.
module = ["llama_index.embeddings.openai.*", "llama_index.embeddings.ollama.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Postgres or network; skipped by check.py --fast"]
# Silences the pytest-asyncio warning; the plugin arrives via llama-index-embeddings-ollama.
asyncio_default_fixture_loop_scope = "function"
